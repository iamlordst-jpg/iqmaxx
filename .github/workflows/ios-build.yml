name: IQMaxx iOS IPA Build
on:
  workflow_dispatch:
  push:
    branches: [main, "build/**"]
permissions:
  contents: read
concurrency:
  group: iqmaxx-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Normalize project format for runner Xcode
        run: |
          sed -i '' 's/objectVersion = 77;/objectVersion = 60;/' IQMaxx.xcodeproj/project.pbxproj
          sed -i '' 's/compatibilityVersion = "Xcode 16.0";/compatibilityVersion = "Xcode 14.0";/' IQMaxx.xcodeproj/project.pbxproj
          grep -E 'objectVersion|compatibilityVersion' IQMaxx.xcodeproj/project.pbxproj | head -5
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build iPhone device app
        run: |
          xcodebuild -project IQMaxx.xcodeproj -scheme IQMaxx -sdk iphoneos -configuration Release -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/IQMaxx.app"
          test -d "$APP_PATH"
          mkdir -p artifacts/Payload
          cp -R "$APP_PATH" artifacts/Payload/IQMaxx.app
          cd artifacts
          zip -r IQMaxx-unsigned.ipa Payload
          unzip -l IQMaxx-unsigned.ipa | head -30
      - uses: actions/upload-artifact@v4
        with:
          name: IQMaxx-unsigned-IPA
          path: artifacts/IQMaxx-unsigned.ipa
          if-no-files-found: error
