name: IQMaxx iOS Build
on:
  workflow_dispatch:
  push:
    branches: [main, "build/**"]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Normalize project format for runner Xcode
        run: |
          sed -i '' 's/objectVersion = 77;/objectVersion = 60;/' IQMaxx.xcodeproj/project.pbxproj
          sed -i '' 's/compatibilityVersion = "Xcode 16.0";/compatibilityVersion = "Xcode 14.0";/' IQMaxx.xcodeproj/project.pbxproj
          grep -E 'objectVersion|compatibilityVersion' IQMaxx.xcodeproj/project.pbxproj | head -5
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build simulator app
        run: |
          xcodebuild -project IQMaxx.xcodeproj -scheme IQMaxx -sdk iphonesimulator -configuration Release -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Package app bundle
        run: |
          mkdir -p artifacts
          cd build/DerivedData/Build/Products/Release-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/artifacts/IQMaxx-Simulator-App.zip" IQMaxx.app
      - uses: actions/upload-artifact@v4
        with:
          name: IQMaxx-Simulator-App
          path: artifacts/IQMaxx-Simulator-App.zip
          if-no-files-found: error
